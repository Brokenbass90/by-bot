[pytest]
# --- Test hygiene (added 2026-06-14 during intake audit) ---
# Why: the full suite passes file-by-file, but running all 200+ tests in a
# single process pulls the 14.7k-line monolith + pandas + matplotlib + every
# backtest module into memory at once. On memory-constrained CI/sandboxes that
# can stall and *look* like a hang. The per-test timeout below turns any real
# hang into a fast failure instead of an indefinite block.
#
# Dev deps required for these options: see requirements-dev.txt
#   pip install -r requirements-dev.txt
#
# Fast lane (recommended for quick local feedback / pre-commit):
#   pytest -m "not slow"
# Full run (CI nightly):
#   pytest
# Only the heavy backtest tests:
#   pytest -m slow
addopts = -p no:cacheprovider --timeout=120 --timeout-method=thread
markers =
    slow: heavy backtest/optimization tests (pair-arb, sweeps) — memory/CPU intensive
testpaths = tests
