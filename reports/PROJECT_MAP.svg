<rect class="infra" x="530" y="800" width="220" height="46" rx="6"/><text class="t" x="640" y="826" text-anchor="middle" font-size="12">operator_console / TG</text>

<text x="410" y="892" text-anchor="middle" font-size="12" fill="#5F5E5A">человек в контуре на деньгах/коде · деньги — только за доказанным эджем</text>
