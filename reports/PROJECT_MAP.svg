<svg viewBox="0 0 820 1020" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img">
<title>Карта проекта торгового бота</title>
<desc>Слои: данные, подбор монет, стратегии по логике, control-plane, исполнение, офлайн-валидация, ИИ и наблюдаемость. Бирюзовый — live/доказанный, янтарный — shadow/research, синий — валидация, серый — инфраструктура.</desc>
<style>
.t{font-weight:500;}
rect.box{fill:#E1F5EE;stroke:#0F6E56;}
rect.shadow{fill:#FAEEDA;stroke:#854F0B;}
rect.val{fill:#E6F1FB;stroke:#0C447C;}
rect.infra{fill:#F1EFE8;stroke:#5F5E5A;}
text{fill:#04342C;}
text.muted{fill:#5F5E5A;}
</style>
<text x="410" y="28" text-anchor="middle" font-size="18" font-weight="500" fill="#1a1a1a">Bybit/Alpaca trading bot — карта проекта</text>
<text x="40" y="52" font-size="12" fill="#5F5E5A">Легенда: teal=live/доказанный · amber=shadow/research · blue=валидация · gray=инфраструктура</text>

<text x="14" y="86" font-size="11" fill="#5F5E5A">ДАННЫЕ</text>
