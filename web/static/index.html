<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Trading Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #070a0f;
  --bg2: #0d1117;
  --bg3: #161b22;
  --bg4: #1c2128;
  --border: #21262d;
  --border2: #30363d;
  --blue: #58a6ff;
  --blue-dim: #1f3a5f;
  --green: #3fb950;
  --green-dim: #1a3c2b;
  --red: #f85149;
  --red-dim: #3d1f1f;
  --yellow: #d29922;
  --yellow-dim: #2d2008;
  --purple: #bc8cff;
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --radius: 8px;
  --radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Layout ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;min-height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px}
.page{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

/* ── Sidebar ── */
.sidebar-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-logo .logo-icon{font-size:22px}
.sidebar-logo .logo-text{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.sidebar-logo .logo-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.nav-section{padding:10px 8px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding-left:16px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 8px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--blue-dim);color:var(--blue);font-weight:500}
.nav-item .icon{width:16px;text-align:center;font-size:14px;flex-shrink:0}
.sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.user-email{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{margin-top:6px;width:100%;background:none;border:1px solid var(--border2);color:var(--text2);padding:6px;border-radius:var(--radius);cursor:pointer;font-size:12px;transition:all .15s}
.logout-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--text3)}

/* ── Topbar ── */
.topbar-title{font-size:15px;font-weight:600;color:var(--text)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.alive{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.dead{background:var(--red)}
.status-dot.unknown{background:var(--text3)}
.status-label{font-size:12px;color:var(--text2)}
/* ── 1-glance health pills (NEW 2026-05-03) ── */
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;letter-spacing:0.2px;white-space:nowrap;cursor:default}
.pill-good{background:rgba(34,197,94,0.18);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
.pill-bad{background:rgba(239,68,68,0.18);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.pill-neutral{background:rgba(148,163,184,0.18);color:#94a3b8;border:1px solid rgba(148,163,184,0.25)}
.pill-blink{animation:pillblink 1.4s ease-in-out infinite}
@keyframes pillblink{0%,100%{opacity:1}50%{opacity:0.5}}
.refresh-btn{background:none;border:1px solid var(--border2);color:var(--text2);padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:12px}
.refresh-btn:hover{background:var(--bg3);color:var(--text)}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500;margin-bottom:14px}
.card + .card{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid3,.grid2{grid-template-columns:1fr}}

/* ── Stat boxes ── */
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-0.5px}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.blue{color:var(--blue)}
.stat-value.yellow{color:var(--yellow)}

/* ── Regime badge ── */
.regime-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px}
.regime-BULL_TREND,.regime-bull_trend{background:var(--green-dim);color:var(--green);border:1px solid #2ea043}
.regime-BEAR_TREND,.regime-bear_trend{background:var(--red-dim);color:var(--red);border:1px solid #da3633}
.regime-BEAR_CHOP,.regime-bear_chop{background:var(--yellow-dim);color:var(--yellow);border:1px solid #9e6a03}
.regime-BULL_CHOP,.regime-bull_chop{background:#1c2f1e;color:#56d364;border:1px solid #3fb950}
.regime-NEUTRAL,.regime-neutral,.regime-UNKNOWN,.regime-unknown{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);color:var(--text3);padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:hover td{background:var(--bg3)}
tr:last-child td{border-bottom:none}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;line-height:1.25;text-align:center;max-width:100%}
.badge-long{background:var(--green-dim);color:var(--green)}
.badge-short{background:var(--red-dim);color:var(--red)}
.badge-ok{background:var(--green-dim);color:var(--green)}
.badge-warn{background:var(--yellow-dim);color:var(--yellow)}
.badge-dead{background:var(--red-dim);color:var(--red)}
.badge-off{background:var(--bg4);color:var(--text3)}

/* ── P&L coloring ── */
.pos{color:var(--green)}
.neg{color:var(--red)}
.dim{color:var(--text3)}

/* ── Sparkline inline ── */
.sparkline-wrap canvas{display:block}

/* ── Pagination ── */
.pager{display:flex;align-items:center;gap:8px;padding-top:14px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:14px}
.pager-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);cursor:pointer;padding:5px 12px;border-radius:var(--radius);font-size:12px}
.pager-btn:hover:not(:disabled){background:var(--bg4);color:var(--text)}
.pager-btn:disabled{opacity:.35;cursor:not-allowed}
.pager-info{font-size:12px;color:var(--text3)}

/* ── Filters ── */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 12px;border-radius:var(--radius);font-size:13px;outline:none;transition:border-color .15s}
.filter-input::placeholder{color:var(--text3)}
.filter-input:focus{border-color:var(--blue)}
select.filter-input option{background:var(--bg3)}

/* ── Loading & empty ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13px;flex-direction:column;gap:12px}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--text3);padding:40px;font-size:13px}

/* ── Auth ── */
.auth-bg{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .icon{font-size:40px}
.auth-logo h1{font-size:22px;font-weight:700;margin-top:10px;color:var(--text)}
.auth-logo p{font-size:13px;color:var(--text2);margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--blue)}
.field input::placeholder{color:var(--text3)}
.auth-btn{width:100%;background:var(--blue);border:none;color:#fff;padding:11px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .15s}
.auth-btn:hover{opacity:.85}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.err-box{background:var(--red-dim);border:1px solid #da3633;color:var(--red);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:16px}
.totp-hint{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;margin-bottom:18px;text-align:center}
.totp-hint .big{font-size:32px;margin-bottom:8px}
.totp-hint p{font-size:13px;color:var(--text2);line-height:1.6}
.totp-hint strong{color:var(--text)}
.totp-code{font-size:32px;letter-spacing:12px;text-align:center;background:var(--bg3);border:1px solid var(--border2);color:var(--text);width:100%;padding:14px;border-radius:var(--radius);outline:none;font-family:monospace;transition:border-color .15s}
.totp-code:focus{border-color:var(--blue)}

/* ── Strategy card ── */
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.strat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:default;transition:border-color .15s}
.strat-card:hover{border-color:var(--border2)}
.strat-name{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strat-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);margin-bottom:5px}
.strat-row .val{font-size:12px;font-weight:500;color:var(--text)}

/* ── Regime detail ── */
.sleeve-row{display:grid;grid-template-columns:180px 60px 60px 60px 60px auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.sleeve-row:last-child{border-bottom:none}
.sleeve-name{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mult-cell{text-align:center;border-radius:4px;padding:2px 0}
.mult-on{background:rgba(63,185,80,.15);color:var(--green);font-weight:600}
.mult-off{color:var(--text3)}
.sleeve-hdr{color:var(--text3);font-weight:500;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.5px}

/* ── Journal ── */
.journal-item{padding:16px 0;border-bottom:1px solid var(--border)}
.journal-item:last-child{border-bottom:none}
.journal-date{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.journal-date::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.journal-body{font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.7;font-family:inherit;max-height:300px;overflow:hidden;position:relative}
.journal-body.expanded{max-height:none}
.journal-expand{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;margin-top:6px;padding:0}
.journal-expand:hover{text-decoration:underline}

/* ── Alpaca ── */
.pick-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.pick-ticker{font-size:20px;font-weight:700;color:var(--text);margin-bottom:2px}
.pick-month{font-size:11px;color:var(--text3);margin-bottom:12px}
.pick-metric{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:5px}
.pick-metric .v{color:var(--text);font-weight:500}
.pick-entry{background:var(--bg4);border-radius:var(--radius);padding:8px 10px;margin-top:10px;font-size:11px;color:var(--text3)}
.pick-entry span{color:var(--text);font-weight:500}

/* ── Chart container ── */
.chart-wrap{position:relative;height:220px;width:100%}

/* ── Progress bar ── */
.progress-bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s}

/* ── Scrollable table container ── */
.tbl-scroll{max-height:420px;overflow-y:auto}

/* ── Section headers ── */
.section-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.section-sub{font-size:12px;color:var(--text3);font-weight:400;margin-left:4px}

/* ── Pulse animation for live dot ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s ease-in-out infinite}

/* ── Info row ── */
.info-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-row .label{width:180px;flex-shrink:0;font-size:12px;color:var(--text3)}
.info-row .value{color:var(--text)}

/* ── Page header ── */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}

/* ── Trade chart modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:920px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:15px;font-weight:700;color:var(--text);flex:1}
.modal-close{background:none;border:1px solid var(--border2);color:var(--text2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-meta{display:flex;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.modal-stat{display:flex;flex-direction:column;gap:2px}
.modal-stat .ms-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.modal-stat .ms-val{font-size:13px;font-weight:600;color:var(--text)}
.modal-chart-wrap{flex:1;min-height:360px;padding:0;position:relative;overflow:hidden}
.modal-chart-wrap>div{width:100%;height:100%}
.modal-interval-bar{display:flex;gap:4px;padding:8px 20px;border-top:1px solid var(--border);background:var(--bg3);flex-shrink:0}
.interval-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s}
.interval-btn:hover{background:var(--bg4);color:var(--text)}
.interval-btn.active{background:var(--blue-dim);color:var(--blue);border-color:var(--blue)}
tr.clickable-row{cursor:pointer}
tr.clickable-row:hover td{background:var(--blue-dim)!important}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── API ────────────────────────────────────────────────────────────────────

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'include', ...opts });
  if (r.status === 401) {
    const b = await r.json().catch(() => ({}));
    throw Object.assign(new Error(b.detail || 'Unauthorized'), { status: 401 });
  }
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.detail || `HTTP ${r.status}`); }
  return r.json();
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

// ── Sparkline via Canvas ───────────────────────────────────────────────────

function Sparkline({ data, color = '#3fb950', width = 80, height = 32 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length < 2) return;
    const ctx = ref.current.getContext('2d');
    const W = width, H = height;
    ctx.clearRect(0, 0, W, H);
    const min = Math.min(...data), max = Math.max(...data);
    const range = max - min || 1;
    const pts = data.map((v, i) => [i / (data.length - 1) * W, H - ((v - min) / range) * (H - 4) - 2]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // fill under
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = color + '22';
    ctx.fill();
  }, [data, color, width, height]);
  return React.createElement('canvas', { ref, width, height });
}

// ── Auth Screens ───────────────────────────────────────────────────────────

function LoginScreen({ onPartial }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try { await post('/auth/login', { email, password: pw }); onPartial(email); }
    catch(ex) { setErr(ex.status === 401 ? 'Неверный email или пароль' : (ex.message || 'Login failed')); }
    finally { setLoading(false); }
  }

  return React.createElement('div', { className: 'auth-bg' },
    React.createElement('div', { className: 'auth-box' },
      React.createElement('div', { className: 'auth-logo' },
        React.createElement('div', { className: 'icon' }, '📈'),
        React.createElement('h1', null, 'Trading Journal'),
        React.createElement('p', null, 'Sign in to your account')
      ),
      err && React.createElement('div', { className: 'err-box' }, err),
      React.createElement('form', { onSubmit: submit },
        React.createElement('div', { className: 'field' },
          React.createElement('label', null, 'Email address'),
          React.createElement('input', { type: 'email', value: email, onChange: e => setEmail(e.target.value), placeholder: 'you@example.com', required: true, autoFocus: true })
        ),
        React.createElement('div', { className: 'field' },
          React.createElement('label', null, 'Password'),
          React.createElement('input', { type: 'password', value: pw, onChange: e => setPw(e.target.value), placeholder: '••••••••', required: true })
        ),
        React.createElement('button', { type: 'submit', className: 'auth-btn', disabled: loading }, loading ? 'Signing in…' : 'Continue →')
      )
    )
  );
}

// ── Shared hooks ───────────────────────────────────────────────────────────

function useFetch(url, deps = [], pollMs = 0) {
  const _deps = Array.isArray(deps) ? deps : [];
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const dataRef = useRef(null);

  const load = React.useCallback((opts = {}) => {
    let cancelled = false;
    const silent = !!opts.silent && dataRef.current !== null;
    if (!silent) setLoading(true);
    api(url).then(d => {
              if (!cancelled) {
                dataRef.current = d;
                setData(d);
                setError(null);
                setLoading(false);
              }
            })
            .catch(e => {
              if (!cancelled) {
                setError(e);
                setLoading(false);
              }
            });
    return () => { cancelled = true; };
  }, [url]);

  useEffect(() => {
    const cancel = load();
    return cancel;
  }, [load, ..._deps]);

  useEffect(() => {
    if (!pollMs || pollMs <= 0) return undefined;
    const t = setInterval(() => load({ silent: true }), pollMs);
    return () => clearInterval(t);
  }, [load, pollMs]);

  return { data, loading, error, refresh: load };
}

function Loader() {
  return React.createElement('div', { className: 'loading' },
    React.createElement('div', { className: 'spinner' }),
    React.createElement('span', null, 'Loading…'));
}

function fmt(n, dec = 2) {
  if (n == null) return '—';
  const v = parseFloat(n);
  if (isNaN(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(dec);
}

function fmtPF(pf) {
  if (pf == null) return '—';
  return parseFloat(pf).toFixed(3);
}

function fmtPx(n, dec = 4) {
  if (n == null || n === '') return '—';
  const v = parseFloat(n);
  if (isNaN(v)) return '—';
  return v.toFixed(dec);
}

function runnerTargets(p) {
  const targets = p && p.runner && Array.isArray(p.runner.targets) ? p.runner.targets : [];
  return targets.filter(t => t && t.price != null).slice(0, 4);
}

function renderTpCell(p) {
  const exchangeTp = p ? (p.exchange_tp ?? p.tp ?? p.take_profit) : null;
  const targets = runnerTargets(p);
  if (!targets.length) {
    return fmtPx(exchangeTp);
  }
  return React.createElement('div', {
    title: exchangeTp ? `Exchange TP: ${fmtPx(exchangeTp)}` : 'Runner targets are managed by the bot; exchange TP is empty',
    style: { lineHeight: 1.35, whiteSpace: 'nowrap' }
  },
    targets.map((t, idx) => {
      const hit = t.hit === true || t.status === 'hit';
      const frac = t.frac != null && !isNaN(parseFloat(t.frac))
        ? ` ${Math.round(parseFloat(t.frac) * 100)}%`
        : '';
      return React.createElement('div', {
        key: `${t.index || idx + 1}:${t.price}`,
        style: { color: hit ? 'var(--text3)' : 'var(--green)' }
      },
        `TP${t.index || idx + 1} ${fmtPx(t.price)}${frac}`,
        hit && React.createElement('span', { className: 'dim' }, ' hit')
      );
    })
  );
}

function regimeLabel(r) {
  return (r || 'unknown').replace(/_/g, ' ').toUpperCase();
}

function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  const rem = m % 60;
  return rem > 0 ? `${h}h ${rem}m` : `${h}h`;
}

function fmtTime(ms) {
  return new Date(ms).toISOString().slice(0, 16).replace('T', ' ');
}

function tradeGeometryTruth(trade) {
  const geometry = trade && trade.signal_geometry && typeof trade.signal_geometry === 'object'
    ? trade.signal_geometry
    : {};
  const isPrice = value => value !== null && value !== '' && Number.isFinite(Number(value)) && Number(value) > 0;
  const hasLevel = isPrice(geometry.primary_level)
    || (Array.isArray(geometry.horizontal_levels) && geometry.horizontal_levels.some(row => isPrice(row && row.price)))
    || (Array.isArray(geometry.sloped_lines) && geometry.sloped_lines.some(row => isPrice(row && row.projection_at_signal)));
  if (geometry.schema_version === 'position_geometry_v1' && hasLevel) {
    return { geometry, kind: 'exact', label: 'Точный уровень входа', color: '#3fb950' };
  }
  if (hasLevel) {
    return { geometry, kind: 'reconstructed', label: 'Уровень восстановлен', color: '#d29922' };
  }
  return { geometry, kind: 'missing', label: 'Уровень не записан', color: '#8b949e' };
}

function TradeCandlesSvg({ trade, chartData }) {
  const candles = (chartData && chartData.candles) || [];

  const exit = parseFloat(trade.exit || trade.exit_price);
  const sl = parseFloat(trade.sl || trade.sl_price);
  const tp = parseFloat(trade.tp || trade.tp_price);
  const side = String(trade.side || '').toLowerCase();
  const pnl = parseFloat(trade.pnl);
  const geometryTruth = tradeGeometryTruth(trade);
  const geometry = geometryTruth.geometry;

  const W = 920, H = 390;
  const left = 54, right = 124, top = 26, bottom = 48;
  const plotW = W - left - right;
  const plotH = H - top - bottom;
  const values = [];
  candles.forEach(c => values.push(c.high, c.low, c.open, c.close));
  [entry, exit, sl, tp, parseFloat(geometry.primary_level)].forEach(v => { if (!isNaN(v)) values.push(v); });
  (geometry.horizontal_levels || []).forEach(row => {
    const value = parseFloat(row && row.price);
    if (!isNaN(value)) values.push(value);
  });
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const pad = Math.max((maxV - minV) * 0.12, Math.abs(entry || values[0] || 1) * 0.001, 1e-9);
  const lo = minV - pad;
  const hi = maxV + pad;
  const y = v => top + (hi - v) / Math.max(1e-9, hi - lo) * plotH;
  const x = i => left + (candles.length === 1 ? plotW / 2 : (i / (candles.length - 1)) * plotW);
  const barW = Math.max(3, Math.min(14, plotW / candles.length * 0.58));
  const closestIdx = ts => {
    if (!ts) return 0;
    let best = 0, bestD = Infinity;
    candles.forEach((c, i) => {
      const d = Math.abs(Number(c.time_ms) - ts);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  };
  const entryIdx = closestIdx(entryTs);
  const exitIdx = closestIdx(exitTs || entryTs);
  const line = (price, stroke, label) => isNaN(price) ? null : React.createElement(React.Fragment, { key: label },
    React.createElement('line', { x1: left, y1: y(price), x2: W - right + 18, y2: y(price), stroke, strokeDasharray: '6 6', strokeWidth: 1.4, opacity: 0.85 }),
    React.createElement('text', { x: W - right + 24, y: y(price) + 4, fill: stroke, fontSize: 13, fontFamily: 'monospace' }, `${label} ${price.toFixed(4)}`)

  const marker = (idx, price, color, label, above) => {
    if (isNaN(price)) return null;

    const cy = y(price);
    const textY = above ? cy - 18 : cy + 28;
    return React.createElement(React.Fragment, { key: label },
      React.createElement('circle', { cx, cy, r: 6, fill: color, stroke: '#0d1117', strokeWidth: 2 }),
      React.createElement('text', { x: cx, y: textY, fill: color, fontSize: 12, fontFamily: 'monospace', textAnchor: 'middle', fontWeight: 700 },
        `${label} ${price.toFixed(4)}`)
    );
  };
  const geometryLines = [];
  (geometry.horizontal_levels || []).forEach((row, idx) => {
    const price = parseFloat(row && row.price);
    if (isNaN(price)) return;
    geometryLines.push(line(price, '#f2cc60', String((row && row.role) || `LEVEL ${idx + 1}`).toUpperCase()));
  });
  const trend = Array.isArray(geometry.sloped_lines) && geometry.sloped_lines.length
    ? geometry.sloped_lines[0]
    : null;
  if (trend && !isNaN(parseFloat(trend.projection_at_signal))) {
    const projection = parseFloat(trend.projection_at_signal);
    const slopePerDay = parseFloat(trend.slope_pct_per_day || 0);
    const entryRefTs = entryTs || Number(candles[entryIdx] && candles[entryIdx].time_ms) || 0;
    const points = candles.map((c, idx) => {
      const days = entryRefTs ? (Number(c.time_ms) - entryRefTs) / 86400000 : 0;
      return `${x(idx)},${y(projection + projection * (slopePerDay / 100) * days)}`;
    }).join(' ');
    geometryLines.push(React.createElement('polyline', {
      key: 'signal-trendline',
      points,
      fill: 'none',
      stroke: '#f2cc60',
      strokeWidth: 2.2,
      opacity: 0.95,
    }));
  }
  const sourceText = chartData.source === 'bybit'
    ? 'Свечной график загружен с Bybit. Маркеры входа/выхода, SL и TP взяты из журнала сделки.'
    : chartData.source === 'cache'
      ? 'Свечной график загружен из локального кэша. Маркеры входа/выхода, SL и TP взяты из журнала сделки.'
      : 'Свечной график сделки. Маркеры входа/выхода, SL и TP взяты из журнала сделки.';

  return React.createElement('div', { style: { width: '100%', height: '100%', padding: '14px 16px 8px', display: 'flex', flexDirection: 'column' } },
    React.createElement('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: { flex: 1, minHeight: '340px' }, preserveAspectRatio: 'xMidYMid meet' },
      React.createElement('rect', { x: left - 14, y: top - 10, width: plotW + 28, height: plotH + 20, rx: 12, fill: '#0d1117', stroke: '#21262d' }),

        x1: left,

        x2: left + plotW,
        y2: top + i * (plotH / 4),
        stroke: '#161b22'
      })),
      candles.map((c, i) => {
        const up = Number(c.close) >= Number(c.open);
        const color = up ? '#3fb950' : '#f85149';
        const cx = x(i);
        const yOpen = y(Number(c.open));
        const yClose = y(Number(c.close));
        const bodyY = Math.min(yOpen, yClose);

        return React.createElement(React.Fragment, { key: `${c.time_ms}-${i}` },

      line(tp, '#3fb950', 'TP'),

// outcome badge: sl → red, tp → green, time → yellow, manual → grey
function OutcomeBadge({ outcome, reason }) {
  if (!outcome && !reason) return React.createElement('span', { className: 'dim' }, '—');
  const o = (outcome || reason || '').toLowerCase();
  const isTP = o.includes('tp') || o.includes('take');
  const isSL = o.includes('sl') || o.includes('stop') || o.includes('liq');
  const isTime = o.includes('time') || o.includes('expire');
  const color = isTP ? '#3fb950' : isSL ? '#f85149' : isTime ? '#e3b341' : '#8b949e';
  const label = isTP ? 'TP ✓' : isSL ? 'SL ✗' : isTime ? 'TIME' : (outcome || '—').toUpperCase();
  return React.createElement('span', {
    style: { color, fontWeight: 600, fontSize: '11px', whiteSpace: 'nowrap' },
    title: reason || outcome,
  }, label);
}

  const side = String(card.side || '').toLowerCase();

    api(`/api/setup-scanner/chart?${q.toString()}`)
      .then(d => { setChartData(d); setLoading(false); })
      .catch(e => { setChartData({ candles: [], error: e.message || 'chart_fetch_failed' }); setChartError(e.message || 'chart_fetch_failed'); setLoading(false); });
  }, [card.symbol, interval]);

  // Load on open; reload when interval changes
  useEffect(() => {
    if (open) loadChart();
  }, [open, loadChart]);

  // Cleanup chart + reset data when modal closes
  useEffect(() => {
    if (!open) {
      if (lwChartRef.current) { lwChartRef.current.remove(); lwChartRef.current = null; }
      setChartData(null);
      setChartError('');
    }
  }, [open]);

  // Cleanup on unmount
  useEffect(() => {
    return () => { if (lwChartRef.current) { lwChartRef.current.remove(); lwChartRef.current = null; } };
  }, []);

  // Build / rebuild LightweightCharts when data arrives
  useEffect(() => {
    if (!chartData || !chartRef.current || loading) return;
    if (!USE_LIGHTWEIGHT_SETUP_CHART) return;
    const candles = (chartData.candles || []).map(c => ({
      time: Math.floor(c.time_ms / 1000),
      open: c.open, high: c.high, low: c.low, close: c.close,
    }));
    if (!candles.length) return;
    if (!window.LightweightCharts || !LightweightCharts.createChart) {
      setChartError('chart_library_unavailable');
      return;
    }

    const container = chartRef.current;
    if (lwChartRef.current) { lwChartRef.current.remove(); lwChartRef.current = null; }

    let chart;
    try {
      chart = LightweightCharts.createChart(container, {
        width: Math.max(320, container.clientWidth || 0),
        height: Math.max(260, container.clientHeight || 0),
        layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
        grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#21262d' },
        timeScale: { borderColor: '#21262d', timeVisible: true, secondsVisible: false },
      });
    } catch (err) {
      setChartError(err?.message || 'chart_render_failed');
      return;
    }
    lwChartRef.current = chart;

    const cSeries = chart.addCandlestickSeries({
      upColor: '#3fb950', downColor: '#f85149',
      borderUpColor: '#3fb950', borderDownColor: '#f85149',
      wickUpColor: '#3fb950', wickDownColor: '#f85149',
    });
    cSeries.setData(candles);

    const firstT = candles[0].time;
    const lastT  = candles[candles.length - 1].time;

    // Level line (resistance for short = red, support for long = green)
    const lvl = parseFloat(card.level_price);
    if (!isNaN(lvl) && lvl > 0) {
      const lvlLine = chart.addLineSeries({
        color: levelColor, lineWidth: 2, lineStyle: 1,
        lastValueVisible: true, priceLineVisible: false,
        title: `Lvl ×${card.level_touches || 1}`,
      });
      lvlLine.setData([{ time: firstT, value: lvl }, { time: lastT, value: lvl }]);
    }

    // Invalidation line (yellow dashed)
    const inv = parseFloat(card.invalidation);
    if (!isNaN(inv) && inv > 0) {
      const invLine = chart.addLineSeries({
        color: '#e3b341', lineWidth: 1, lineStyle: 2,
        lastValueVisible: true, priceLineVisible: false,
        title: 'Inval',
      });
      invLine.setData([{ time: firstT, value: inv }, { time: lastT, value: inv }]);
    }

    chart.timeScale().fitContent();

    const ro = new ResizeObserver(() => {
      if (lwChartRef.current && container) {
        lwChartRef.current.resize(container.clientWidth, container.clientHeight);
      }
    });
    ro.observe(container);
    return () => { ro.disconnect(); };
  }, [chartData, loading, card.level_price, card.invalidation, levelColor]);

  // Close on Escape
  useEffect(() => {
    if (!open) return;
    const handler = e => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [open]);

  const INTERVALS = [
    { v: '5', l: '5m' }, { v: '15', l: '15m' },
    { v: '60', l: '1h' }, { v: '240', l: '4h' },
  ];

  const lvl = parseFloat(card.level_price);
  const inv = parseFloat(card.invalidation);
  const dist = parseFloat(card.distance_atr);
  const score = parseFloat(card.score);
  const fallbackCandles = chartData && Array.isArray(chartData.candles) ? chartData.candles : [];
  const channelOverlay = chartData?.geometry?.channel || card?.geometry?.channel || null;

  function renderFallbackChart() {
    if (!fallbackCandles.length) return null;
    const W = 1000, H = 330, pad = 28;
    const rows = fallbackCandles.slice(-90);
    const highs = rows.map(c => Number(c.high)).filter(Number.isFinite);
    const lows = rows.map(c => Number(c.low)).filter(Number.isFinite);
    const channelPrices = channelOverlay ? [channelOverlay.upper_now, channelOverlay.lower_now, channelOverlay.mid_now].map(Number).filter(Number.isFinite) : [];
    const prices = highs.concat(lows, channelPrices);
    if (!prices.length) return null;
    const extra = Math.max(1e-9, (Math.max(...prices) - Math.min(...prices)) * 0.08);
    const minP = Math.min(...prices, !isNaN(lvl) ? lvl : Infinity, !isNaN(inv) ? inv : Infinity) - extra;
    const maxP = Math.max(...prices, !isNaN(lvl) ? lvl : -Infinity, !isNaN(inv) ? inv : -Infinity) + extra;
    const y = p => pad + (maxP - p) / Math.max(1e-9, maxP - minP) * (H - pad * 2);
    const xStep = (W - pad * 2) / Math.max(1, rows.length - 1);
    const candleW = Math.max(3, Math.min(8, xStep * 0.55));
    const line = (price, color, dash) => isNaN(price) || price <= 0 ? null :
      React.createElement('line', { x1: pad, y1: y(price), x2: W - pad, y2: y(price), stroke: color, strokeWidth: 2, strokeDasharray: dash || '' });
    const slopedLine = (endPrice, color, dash, width) => {
      if (!channelOverlay || !Number.isFinite(Number(endPrice))) return null;
      const lookback = Math.min(rows.length, Math.max(3, Number(channelOverlay.lookback_bars || 72)));
      const slope = Number(channelOverlay.slope_per_bar || 0);
      const startPrice = Number(endPrice) - slope * (lookback - 1);
      const startX = pad + Math.max(0, rows.length - lookback) * xStep;
      return React.createElement('line', {
        x1: startX, y1: y(startPrice), x2: W - pad, y2: y(Number(endPrice)),
        stroke: color, strokeWidth: width || 1.5, strokeDasharray: dash || '', opacity: 0.9,
      });
    };
    return React.createElement('div', { style: { width: '100%', height: '100%', padding: '10px 12px' } },
      React.createElement('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: '100%', preserveAspectRatio: 'none' },
        [0, .25, .5, .75, 1].map(t => React.createElement('line', {
          key: `g-${t}`, x1: pad, x2: W - pad, y1: pad + t * (H - pad * 2), y2: pad + t * (H - pad * 2),
          stroke: '#161b22', strokeWidth: 1,
        })),
        rows.map((c, i) => {
          const o = Number(c.open), h = Number(c.high), l = Number(c.low), cl = Number(c.close);
          if (![o, h, l, cl].every(Number.isFinite)) return null;
          const x = pad + i * xStep;
          const up = cl >= o;
          const color = up ? '#3fb950' : '#f85149';
          const top = Math.min(y(o), y(cl));
          const height = Math.max(1, Math.abs(y(o) - y(cl)));
          return React.createElement('g', { key: `${c.time_ms || i}` },
            React.createElement('line', { x1: x, y1: y(h), x2: x, y2: y(l), stroke: color, strokeWidth: 1.5 }),
            React.createElement('rect', { x: x - candleW / 2, y: top, width: candleW, height, fill: color, rx: 1 })
          );
        }),
        line(lvl, levelColor, ''),
        line(inv, '#e3b341', '8 6'),
        slopedLine(channelOverlay?.upper_now, '#d29922', '', 2),
        slopedLine(channelOverlay?.mid_now, '#58a6ff', '7 5', 1.25),
        slopedLine(channelOverlay?.lower_now, '#d29922', '', 2)
      ),
      chartError ? React.createElement('div', {
        style: { position: 'absolute', left: 20, bottom: 14, color: 'var(--yellow)', fontSize: '11px' }
      }, `Fallback chart: ${chartError}`) : null
    );
  }

  const modal = React.createElement('div', {
    className: 'modal-overlay',
    onClick: e => { if (e.target === e.currentTarget) setOpen(false); },
  },
    React.createElement('div', { className: 'modal-box' },
      // Header
      React.createElement('div', { className: 'modal-header' },
        React.createElement('div', { className: 'modal-title' },
          React.createElement('span', { style: { color: '#58a6ff' } }, card.symbol || '—'),
          ' · ',
          React.createElement('span', { style: { color: '#8b949e', fontSize: '13px' } }, card.setup_type || card.strategy || '—'),
          '  ',
          React.createElement('span', {
            className: side === 'short' ? 'badge badge-short' : 'badge badge-long',
          }, side.toUpperCase() || '—')
        ),
        React.createElement('button', { className: 'modal-close', onClick: () => setOpen(false) }, '×')
      ),
      // Meta stats bar
      React.createElement('div', { className: 'modal-meta' },
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Price'),
          React.createElement('span', { className: 'ms-val' },
            parseFloat(card.price) > 0 ? parseFloat(card.price).toFixed(4) : '—')
        ),
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, `Level (${card.level_touches || 1}×)`),
          React.createElement('span', { className: 'ms-val', style: { color: levelColor } },
            !isNaN(lvl) && lvl > 0 ? lvl.toFixed(4) : '—')
        ),
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Dist ATR'),
          React.createElement('span', { className: 'ms-val' }, !isNaN(dist) ? dist.toFixed(2) : '—')
        ),
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Invalidation'),
          React.createElement('span', { className: 'ms-val', style: { color: '#e3b341' } },
            !isNaN(inv) && inv > 0 ? inv.toFixed(4) : '—')
        ),
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Score'),
          React.createElement('span', { className: 'ms-val' }, !isNaN(score) ? score.toFixed(2) : '—')
        ),
        React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Strategy'),
          React.createElement('span', { className: 'ms-val', style: { fontSize: '11px', fontWeight: 400 } },
            (card.strategy || '—').replace(/^(alt_|btc_eth_|inplay_)/g, ''))
        ),
        channelOverlay && React.createElement('div', { className: 'modal-stat' },
          React.createElement('span', { className: 'ms-label' }, 'Наклонная'),
          React.createElement('span', { className: 'ms-val', style: { color: '#d29922', fontSize: '11px' } },
            `${Number(channelOverlay.slope_pct_per_bar || 0).toFixed(4)}%/bar · R² ${Number(channelOverlay.r2 || 0).toFixed(2)}`)
        ),
      ),
      // Chart area
      React.createElement('div', { className: 'modal-chart-wrap' },
        loading
          ? React.createElement('div', { className: 'loading' },
              React.createElement('div', { className: 'spinner' }),
              React.createElement('span', null, 'Загрузка свечей…'))
          : (chartData && (!chartData.candles || chartData.candles.length === 0))
            ? React.createElement('div', { className: 'empty' }, chartError ? `📭 Свечи недоступны: ${chartError}` : '📭 Свечи недоступны')
            : (chartError || !USE_LIGHTWEIGHT_SETUP_CHART)
              ? renderFallbackChart()
              : React.createElement('div', { ref: chartRef, style: { width: '100%', height: '100%' } })
      ),
      // Reasons row
      card.reasons && card.reasons.length > 0
        ? React.createElement('div', {
            style: { padding: '8px 20px', fontSize: '11px', color: '#8b949e', borderTop: '1px solid var(--border)', flexShrink: 0 }
          },
            React.createElement('span', { style: { color: '#58a6ff', marginRight: '6px' } }, 'Сигналы:'),
            card.reasons.join(' · ')
          )
        : null,
      // Interval selector
      React.createElement('div', { className: 'modal-interval-bar' },
        React.createElement('span', {
          style: { fontSize: '11px', color: '#8b949e', marginRight: '4px', lineHeight: '24px' }
        }, 'Интервал:'),
        ...INTERVALS.map(({ v, l }) =>
          React.createElement('button', {
            key: v,
            className: `interval-btn${interval === v ? ' active' : ''}`,
            onClick: () => setInterval(v),
          }, l)
        )
      )
    )
  );

  return React.createElement('div', { style: { marginTop: '10px' } },
    React.createElement('button', { className: 'refresh-btn', onClick: () => setOpen(true) }, 'График'),
    open ? modal : null
  );
}

function setupCardPrompt(c, fr) {
  const reasons = (c.reasons || []).join(' · ') || 'no reasons';
  const runtime = c.runtime || {};
  const funding = fr ? `${fr.rate_pct > 0 ? '+' : ''}${fr.rate_pct.toFixed(4)}% / 8h` : 'unknown';
  const channel = c?.geometry?.channel;
  return [
    'Разбери эту карточку Setup Scanner как старший трейдер.',
    'Не предлагай live-вход без подтверждения risk/backtest gates; дай план: что должно подтвердиться, где инвалидация, какой риск, стоит ли ждать.',
    '',
    `Symbol: ${c.symbol}`,
    `Side: ${c.side || 'watch'}`,
    `Interval: ${c.interval || '?'}m`,
    `Setup: ${c.setup_type || '-'}`,
    `Strategy: ${c.strategy || '-'}`,
    `Score: ${Number(c.score || 0).toFixed(2)}`,
    `Price: ${c.price ?? '-'}`,
    `Level: ${c.level_price ?? '-'} (${c.level_touches || 0} touches)`,
    `Distance ATR: ${c.distance_atr ?? '-'}`,
    `Invalidation: ${c.invalidation ?? '-'}`,
    `Channel: ${channel ? `${Number(channel.slope_pct_per_bar || 0).toFixed(4)}%/bar R2=${Number(channel.r2 || 0).toFixed(3)} upper=${channel.upper_now} lower=${channel.lower_now}` : '-'}`,
    `Runtime: ${runtime.enabled ? 'LIVE' : 'WATCH'} risk=${runtime.risk_mult ?? runtime.final_risk_mult ?? 0} health=${runtime.health || '-'}`,
    `Funding: ${funding}`,
    `Reasons: ${reasons}`,
  ].join('\n');
}

// ── Setup Card with AI analysis ───────────────────────────────────────────
function SetupCard({ c, sideBadge, frRates, frColor }) {
  const [aiState, setAiState] = useState(null);  // null | 'loading' | {verdict, reasoning, risk_note}
  const [chatState, setChatState] = useState(null);

  const VERDICT_COLOR = {
    strong: 'var(--green)',
    ok:     'var(--blue)',
    weak:   'var(--yellow)',
    skip:   'var(--red)',
  };
  const VERDICT_ICON = { strong: '🟢', ok: '🔵', weak: '🟡', skip: '🔴' };

  const runAI = async () => {
    setAiState('loading');
    try {
      const fr = frRates[c.symbol];
      const body = {
        symbol:           c.symbol,
        side:             c.side || '',
        setup_type:       c.setup_type || '',
        strategy:         c.strategy || '',
        score:            c.score,
        price:            c.price,
        level_price:      c.level_price,
        distance_atr:     c.distance_atr,
        invalidation:     c.invalidation,
        reasons:          c.reasons || [],
        interval:         String(c.interval || ''),
        runtime_status:   c.runtime?.health || (c.runtime?.enabled ? 'live' : 'watch'),
        funding_rate_pct: fr ? fr.rate_pct : null,
        channel_slope_pct_per_bar: c?.geometry?.channel?.slope_pct_per_bar ?? null,
        channel_r2: c?.geometry?.channel?.r2 ?? null,
      };
      const token = localStorage.getItem('auth_token') || '';
      const resp = await fetch('/api/ai/analyze-setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      setAiState(data);
    } catch (err) {
      setAiState({ verdict: 'skip', reasoning: String(err), risk_note: 'Request failed' });
    }
  };

  const sendToAIChat = () => {
    const prompt = setupCardPrompt(c, frRates[c.symbol]);
    localStorage.setItem('ai_prefill', prompt);
    localStorage.setItem('ai_prefill_card', JSON.stringify(c));
    window.dispatchEvent(new CustomEvent('open-ai-chat-card', { detail: { prompt, card: c } }));
    setChatState('sent');
    setTimeout(() => setChatState(null), 1800);
  };

  return React.createElement('div', { className: 'card', style: { minHeight: '230px' } },
    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '10px', alignItems: 'flex-start', marginBottom: '12px' } },
      React.createElement('div', null,
        React.createElement('div', { style: { fontSize: '20px', fontWeight: 700 } }, c.symbol),
        React.createElement('div', { className: 'section-sub' }, `${c.interval}m · score ${Number(c.score || 0).toFixed(1)}`)
      ),
      React.createElement('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
        React.createElement('span', { className: `badge ${sideBadge(c.side)}` }, c.side || 'WATCH'),
        React.createElement('button', {
          className: 'refresh-btn',
          style: { fontSize: '12px', padding: '3px 8px' },
          onClick: sendToAIChat,
          title: 'Отправить карточку в AI Chat',
        }, chatState === 'sent' ? '✓ Chat' : '↗ Chat'),
        React.createElement('button', {
          className: 'refresh-btn',
          style: { fontSize: '12px', padding: '3px 8px', opacity: aiState === 'loading' ? 0.5 : 1 },
          onClick: runAI,
          disabled: aiState === 'loading',
          title: 'AI анализ сетапа',
        }, aiState === 'loading' ? '⏳' : '🤖 AI')
      )
    ),
    React.createElement('div', { className: 'card-title', style: { marginBottom: '8px' } }, c.setup_type),
    React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px 14px', fontSize: '13px' } },
      React.createElement('div', { className: 'dim' }, 'Стратегия'),
      React.createElement('div', { style: { textAlign: 'right', color: 'var(--blue)', fontWeight: 600 } }, c.strategy),
      React.createElement('div', { className: 'dim' }, 'Цена'),
      React.createElement('div', { style: { textAlign: 'right' } }, c.price ?? '—'),
      React.createElement('div', { className: 'dim' }, 'Уровень'),
      React.createElement('div', { style: { textAlign: 'right' } }, c.level_price ? `${c.level_price} (${c.level_touches || 0} кас.)` : '—'),
      React.createElement('div', { className: 'dim' }, 'Дистанция'),
      React.createElement('div', { style: { textAlign: 'right' } }, c.distance_atr != null ? `${c.distance_atr} ATR` : '—'),
      React.createElement('div', { className: 'dim' }, 'Инвалидация'),
      React.createElement('div', { style: { textAlign: 'right' } }, c.invalidation ?? '—'),
      React.createElement('div', { className: 'dim' }, 'Runtime'),
      React.createElement('div', { style: { textAlign: 'right' } },
        c.runtime && c.runtime.enabled
          ? React.createElement('span', { className: 'badge badge-ok' }, `LIVE ×${Number(c.runtime.risk_mult || 0).toFixed(2)}`)
          : React.createElement('span', { className: 'badge badge-off' }, c.runtime?.health || 'watch')),
      React.createElement('div', { className: 'dim' }, 'Funding 8h'),
      React.createElement('div', { style: { textAlign: 'right', color: frColor((frRates[c.symbol] || {}).tier), fontWeight: 600 } },
        frRates[c.symbol]
          ? `${(frRates[c.symbol].rate_pct > 0 ? '+' : '')}${frRates[c.symbol].rate_pct.toFixed(4)}%`
          : '—')
    ),
    React.createElement('div', { style: { marginTop: '12px', color: 'var(--text2)', fontSize: '12px', lineHeight: 1.45 } },
      (c.reasons || []).join(' · ') || 'no reasons'),
    (c.router_profiles || []).length > 0 && React.createElement('div', { style: { marginTop: '10px', display: 'flex', flexWrap: 'wrap', gap: '6px' } },
      c.router_profiles.map(p => React.createElement('span', { key: `${c.symbol}-${c.setup_type}-${p.profile}`, className: 'badge badge-warn', title: (p.reasons || []).join(', ') },
        p.profile))
    ),
    aiState && aiState !== 'loading' && React.createElement('div', {
      style: {
        marginTop: '12px', padding: '10px 12px', borderRadius: '8px',
        background: 'var(--card2)', borderLeft: `3px solid ${VERDICT_COLOR[aiState.verdict] || 'var(--blue)'}`,
        fontSize: '12px', lineHeight: 1.5,
      }
    },
      React.createElement('div', { style: { fontWeight: 700, marginBottom: '4px', color: VERDICT_COLOR[aiState.verdict] } },
        `${VERDICT_ICON[aiState.verdict] || '🔵'} ${(aiState.verdict || '').toUpperCase()}`),
      React.createElement('div', { style: { color: 'var(--text)', marginBottom: '6px' } }, aiState.reasoning),
      React.createElement('div', { style: { color: 'var(--text2)', fontStyle: 'italic' } }, `⚠️ ${aiState.risk_note}`)
    ),
    React.createElement(SetupCardChart, { card: c })
  );
}

  const frColor = tier => tier === 'low' ? 'var(--green)' : tier === 'medium' ? 'var(--text)' : tier === 'high' ? 'var(--yellow)' : 'var(--red)';
  if (loading) return React.createElement(Loader);
  if (!data) return React.createElement('div', { className: 'empty' }, 'Нет данных сканера');

  const ageLabel = sec => {
    if (sec == null) return '—';
    if (sec < 90) return `${sec}s`;
    if (sec < 3600) return `${Math.round(sec / 60)}m`;

  const sideBadge = side => {

    if (s === 'long') return 'badge-long';
    if (s === 'short') return 'badge-short';
    return 'badge-warn';
  };
  const cards = data.cards || [];
  const active = data.active_sleeves || [];

  return React.createElement('div', null,
    React.createElement('div', { className: 'page-hdr' },
      React.createElement('div', null,
        React.createElement('div', { className: 'section-title' }, 'Setup Scanner'),
        React.createElement('div', { className: 'section-sub' },
          'Геометрия уровней, наклонок и сжатия. Это кандидаты, не разрешение на сделку.')
      ),
      React.createElement('button', { className: 'refresh-btn', onClick: refresh }, '↺ Refresh')
    ),

function AIChatPage() {
  const [messages, setMessages] = useState([
    { role: 'assistant', content: 'Привет. Я вижу текущий snapshot бота: режим, рукава, сделки, Alpaca и health-состояние. Если данные старые или неполные, я должен сказать об этом прямо. Спроси, что проверить.' }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [pendingCmd, setPendingCmd] = useState(null);
  const [cmdConfirm, setCmdConfirm] = useState(false);
  const [feed, setFeed] = useState([]);
  const [prefillCard, setPrefillCard] = useState(null);
  const bottomRef = useRef(null);
  const textareaRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
  useEffect(() => {
    api('/api/ai/history')
      .then(res => {
        const history = Array.isArray(res?.messages) ? res.messages : [];
        if (history.length > 0) setMessages(history);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    let alive = true;
    const load = () => api('/api/ai/activity?limit=30')
      .then(res => { if (alive && Array.isArray(res?.feed)) setFeed(res.feed.filter(x => x.channel === 'tg')); })
      .catch(() => {});
    load();
    const id = setInterval(load, 20000);
    return () => { alive = false; clearInterval(id); };
  }, []);
  useEffect(() => {
    const loadPrefill = () => {
      const prompt = localStorage.getItem('ai_prefill') || '';
      const rawCard = localStorage.getItem('ai_prefill_card') || '';
      if (prompt.trim()) {
        setInput(prompt);
        localStorage.removeItem('ai_prefill');
      }
      if (rawCard) {
        try { setPrefillCard(JSON.parse(rawCard)); } catch (_) {}
        localStorage.removeItem('ai_prefill_card');
      }
    };
    const onCard = e => {
      const prompt = e?.detail?.prompt || localStorage.getItem('ai_prefill') || '';
      const card = e?.detail?.card || null;
      if (prompt.trim()) {
        setInput(prompt);
        localStorage.removeItem('ai_prefill');
      }
      if (card) setPrefillCard(card);
    };
    loadPrefill();
    window.addEventListener('open-ai-chat-card', onCard);
    return () => window.removeEventListener('open-ai-chat-card', onCard);
  }, []);
  useEffect(() => {
    const el = textareaRef.current;
    if (!el) return;
    el.style.height = '0px';
    el.style.height = `${Math.min(el.scrollHeight, 180)}px`;
  }, [input]);

  async function send(executeCmd = null) {
    const text = input.trim();
    if (!text && !executeCmd) return;
    const userMsg = { role: 'user', content: text, setup_card: prefillCard };
    const newMsgs = text ? [...messages, userMsg] : messages;
    if (text) { setMessages(newMsgs); setInput(''); setPrefillCard(null); }
    setLoading(true);
    try {
      const body = { messages: newMsgs.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content })) };
      if (executeCmd) body.execute_command = executeCmd;
      const res = await post('/api/ai/chat', body);
      const replies = [];
      if (res.command_result) replies.push({ role: 'system', content: `⚙️ ${res.command_result}` });
      if (res.reply) replies.push({ role: 'assistant', content: res.reply });
      setMessages(prev => [...prev, ...replies]);
      if (res.suggested_command) { setPendingCmd(res.suggested_command); setCmdConfirm(true); }
      else { setPendingCmd(null); setCmdConfirm(false); }
    } catch (e) {
      setMessages(prev => [...prev, { role: 'assistant', content: `❌ Error: ${e.message}` }]);
    } finally { setLoading(false); }
  }

  function confirmCmd() {
    setCmdConfirm(false);
    send(pendingCmd);
    setPendingCmd(null);
  }

  function rejectCmd() {
    setCmdConfirm(false); setPendingCmd(null);
    setMessages(prev => [...prev, { role: 'system', content: '❌ Command cancelled.' }]);
  }

  function commandPreview(cmd) {
    if (!cmd) return { title: 'AI command', summary: '', errors: [], risk: 'unknown', evidence: [], preconditions: [] };
    return {
      title: cmd.title || `Command: ${cmd.action || 'unknown'}`,
      summary: cmd.summary || JSON.stringify({ action: cmd.action, params: cmd.params || {} }),
      errors: Array.isArray(cmd.validation_errors) ? cmd.validation_errors : [],
      risk: cmd.risk || 'unknown',
      evidence: Array.isArray(cmd.evidence) ? cmd.evidence : [],
      preconditions: Array.isArray(cmd.preconditions) ? cmd.preconditions : [],
      blocked: !!cmd.blocked,
      raw: JSON.stringify({ action: cmd.action, params: cmd.params || {} }),
    };
  }

  const quickBtns = [
    'Как работает бот прямо сейчас?',
    'Какой режим рынка и что активно?',
    'Разбери лучший setup scanner и дай план без исполнения',
    'Покажи performance по стратегиям',
    'Есть ли проблемы которые надо починить?',
    'Что делает Alpaca?',
  ];

  return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', height: '100%' } },
    React.createElement('div', { className: 'section-title' }, '🤖 AI Assistant'),

    // Operational feed reconstructed from trade events and the pulse digest.
    React.createElement('div', { className: 'card', style: { marginBottom: '10px', maxHeight: '170px', overflowY: 'auto' } },
      React.createElement('div', { style: { fontSize: '11px', color: 'var(--text3)', fontWeight: 700, marginBottom: '6px', letterSpacing: '0.04em' } }, 'СДЕЛКИ И ПУЛЬС БОТА'),
      (feed.length === 0)
        ? React.createElement('div', { style: { fontSize: '12px', color: 'var(--text3)' } }, 'пока пусто — здесь появятся события сделок и пульс')
        : feed.map((it, i) => React.createElement('div', { key: i, style: { display: 'flex', gap: '8px', marginBottom: '5px', fontSize: '12px', lineHeight: 1.45 } },
            React.createElement('span', { style: { color: 'var(--blue)', fontWeight: 700, flexShrink: 0 } }, it.kind === 'pulse' ? 'ПУЛЬС' : 'TG'),
            React.createElement('span', { style: { color: 'var(--text2)', whiteSpace: 'pre-wrap' } }, it.text)
          ))
    ),

    // Chat window
    React.createElement('div', { className: 'card', style: { flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 } },
      React.createElement('div', { style: { flex: 1, overflowY: 'auto', padding: '4px 0', minHeight: '320px', maxHeight: '500px' } },
        messages.map((m, i) => React.createElement('div', {
          key: i,
          style: {
            display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start',
            marginBottom: '12px',
          }
        },
          React.createElement('div', {
            style: {
              maxWidth: '80%', padding: '10px 14px', borderRadius: m.role === 'user' ? '12px 12px 2px 12px' : '12px 12px 12px 2px',
              background: m.role === 'user' ? 'var(--blue-dim)' : m.role === 'system' ? 'var(--bg4)' : 'var(--bg3)',
              border: `1px solid ${m.role === 'user' ? 'var(--blue)' : m.role === 'system' ? 'var(--border2)' : 'var(--border)'}`,
              color: m.role === 'system' ? 'var(--text2)' : 'var(--text)',
              fontSize: '13px', lineHeight: '1.6', whiteSpace: 'pre-wrap',
            }
          },
            m.setup_card ? React.createElement(AIInlineSetupCard, { card: m.setup_card }) : null,
            m.content
          )
        )),
        loading && React.createElement('div', { style: { display: 'flex', gap: '4px', padding: '10px 14px' } },
          [0,1,2].map(i => React.createElement('div', { key: i, style: {
            width: '6px', height: '6px', borderRadius: '50%', background: 'var(--text3)',
            animation: `pulse 1.2s ease-in-out ${i*0.2}s infinite`
          } }))
        ),
        React.createElement('div', { ref: bottomRef })
      ),

      // Pending command confirmation
      cmdConfirm && pendingCmd && React.createElement('div', {
        style: { background: 'var(--yellow-dim)', border: '1px solid var(--yellow)', borderRadius: 'var(--radius)', padding: '12px 14px', margin: '8px 0' }
      },
        (() => {
          const p = commandPreview(pendingCmd);
          return React.createElement(React.Fragment, null,
            React.createElement('div', { style: { fontSize: '12px', color: 'var(--yellow)', fontWeight: 700, marginBottom: '6px' } },
              p.blocked ? 'AI предложил действие, но оно заблокировано проверкой' : 'AI предлагает действие — подтверждать только если понятна причина'),
            React.createElement('div', { style: { fontSize: '14px', color: 'var(--text)', fontWeight: 700, marginBottom: '4px' } }, p.title),
            React.createElement('div', { style: { fontSize: '12px', color: 'var(--text2)', marginBottom: '8px', lineHeight: 1.45 } }, p.summary),
            p.errors.length > 0 && React.createElement('div', { style: { color: 'var(--red)', fontSize: '12px', marginBottom: '8px', lineHeight: 1.45 } },
              'Почему нельзя выполнить: ' + p.errors.join('; ')),
            p.evidence.length > 0 && React.createElement('div', { style: { color: 'var(--text2)', fontSize: '12px', marginBottom: '6px', lineHeight: 1.45 } },
              'Доказательства: ' + p.evidence.join('; ')),
            p.preconditions.length > 0 && React.createElement('div', { style: { color: 'var(--text2)', fontSize: '12px', marginBottom: '6px', lineHeight: 1.45 } },
              'Перед выполнением: ' + p.preconditions.join('; ')),
            React.createElement('details', { style: { marginTop: '8px' } },
              React.createElement('summary', { style: { cursor: 'pointer', color: 'var(--text3)', fontSize: '11px' } }, 'Показать raw JSON'),
              React.createElement('code', { style: { display: 'block', marginTop: '6px', fontSize: '11px', color: 'var(--text2)', whiteSpace: 'pre-wrap' } }, p.raw)
            )
          );
        })(),
        React.createElement('div', { style: { display: 'flex', gap: '8px', marginTop: '10px' } },
          React.createElement('button', {
            className: 'auth-btn',
            disabled: !!pendingCmd.blocked,
            style: { width: 'auto', padding: '6px 16px', background: pendingCmd.blocked ? 'var(--bg4)' : 'var(--green)', fontSize: '13px', opacity: pendingCmd.blocked ? 0.55 : 1 },
            onClick: confirmCmd
          }, pendingCmd.blocked ? 'Выполнение заблокировано' : 'Выполнить'),
          React.createElement('button', { className: 'auth-btn', style: { width: 'auto', padding: '6px 16px', background: 'var(--red-dim)', border: '1px solid var(--red)', fontSize: '13px' }, onClick: rejectCmd }, 'Отменить')
        )
      ),

      // Quick buttons
      React.createElement('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', padding: '10px 0 6px' } },
        quickBtns.map(q => React.createElement('button', {

        }, q))
      ),

  const [account, setAccount] = useState('main');
  const [newKey, setNewKey] = useState('');
  const [newSecret, setNewSecret] = useState('');
  const [busy, setBusy] = useState(false);

  function load() {
    api('/api/admin/bybit-key-info').then(d => {
      setData(d);
      if (d.accounts && d.accounts.length && !d.accounts.some(a => a.name === account)) setAccount(d.accounts[0].name);
    }).catch(e => setMessage(e.message));

        React.createElement('p', null,
          '4. Установи ',
          React.createElement('code', { style: { background: 'var(--bg3)', padding: '2px 6px', borderRadius: '4px' } }, 'TV_WEBHOOK_SECRET'),
          ' в .env на сервере. ',
          React.createElement('code', { style: { background: 'var(--bg3)', padding: '2px 6px', borderRadius: '4px' } }, 'TV_WEBHOOK_MODE'),
          ': log | notify | auto')
      )
    ),

    // Stats row
    data && React.createElement('div', { className: 'grid4', style: { marginBottom: '16px' } },
      React.createElement('div', { className: 'metric' },
        React.createElement('div', { className: 'metric-label' }, 'Всего сигналов'),
        React.createElement('div', { className: 'metric-value' }, data.total || 0)
      ),
      React.createElement('div', { className: 'metric' },
        React.createElement('div', { className: 'metric-label' }, 'Прошли фильтр'),
        React.createElement('div', { className: 'metric-value', style: { color: 'var(--green)' } },
          signals.filter(s => !s.blocked).length)
      ),
      React.createElement('div', { className: 'metric' },
        React.createElement('div', { className: 'metric-label' }, 'Заблокированы'),
        React.createElement('div', { className: 'metric-value', style: { color: 'var(--red)' } },
          signals.filter(s => s.blocked).length)
      ),
      React.createElement('div', { className: 'metric' },
        React.createElement('div', { className: 'metric-label' }, 'Режим'),
        React.createElement('div', { className: 'metric-value', style: { color: 'var(--blue)', fontSize: '14px' } },
          signals[0]?.mode || '—')
      )
    ),

    // Signals table
    React.createElement('div', { className: 'card' },
      React.createElement('div', { className: 'card-title' }, `История сигналов (последние ${signals.length})`),
      loading
        ? React.createElement(Loader)
        : signals.length === 0
          ? React.createElement('div', { className: 'empty' }, '📭 Сигналов пока нет. Настрой Webhook в TradingView.')
          : React.createElement('div', { style: { overflowX: 'auto' } },
              React.createElement('table', { className: 'tbl' },
                React.createElement('thead', null,
                  React.createElement('tr', null,
                    React.createElement('th', null, 'Время'),
                    React.createElement('th', null, 'Symbol'),
                    React.createElement('th', null, 'Side'),
                    React.createElement('th', null, 'Strategy'),
                    React.createElement('th', { style: { textAlign: 'right' } }, 'Price'),
                    React.createElement('th', null, 'TF'),
                    React.createElement('th', null, 'Статус'),
                    React.createElement('th', null, 'Причина блока')
                  )
                ),
                React.createElement('tbody', null,
                  signals.map((s, i) => {
                    const isLong   = s.side === 'long';
                    const blocked  = s.blocked;
                    return React.createElement('tr', { key: i },
                      React.createElement('td', { className: 'dim', style: { fontSize: '11px', whiteSpace: 'nowrap' } }, fmtTime(s.ts)),
                      React.createElement('td', null, React.createElement('strong', null, s.symbol)),
                      React.createElement('td', null,
                        React.createElement('span', { className: isLong ? 'badge badge-long' : 'badge badge-short' },
                          isLong ? 'LONG' : 'SHORT')),
                      React.createElement('td', { className: 'dim', style: { fontSize: '11px' } },
                        (s.strategy || '—').replace(/^(alt_|btc_eth_)/,'')),
                      React.createElement('td', { style: { textAlign: 'right', fontFamily: 'monospace', fontSize: '11px' } },
                        s.price ? s.price.toLocaleString() : '—'),
                      React.createElement('td', { className: 'dim', style: { fontSize: '11px' } }, s.timeframe || '—'),
                      React.createElement('td', null,
                        blocked
                          ? React.createElement('span', { style: { color: 'var(--red)', fontSize: '11px' } }, '🚫 BLOCKED')
                          : React.createElement('span', { style: { color: 'var(--green)', fontSize: '11px' } }, '✅ OK')),
                      React.createElement('td', { className: 'dim', style: { fontSize: '11px' } },
                        (s.block_reasons || []).join(', ') || '—')
                    );
                  })
                )
              )
            )
    )
  );
}

// ── Live Position embedded page ─────────────────────────────────────────────

function LivePositionPage() {
  return React.createElement('div', {
      style: {
        height: 'calc(100vh - 100px)',
        minHeight: '720px',
        margin: '-24px',
        background: 'var(--bg)'
      }
    },
    React.createElement('iframe', {
      title: 'Live Position',
      src: '/static/position.html',
      style: {
        width: '100%',
        height: '100%',
        border: '0',
        display: 'block',
        background: 'var(--bg)'
      }
    })
  );
}

// ── Main App ───────────────────────────────────────────────────────────────

const NAV_GROUPS = [
  {
    label: 'Overview',
    pages: [
      { id: 'dashboard',  label: 'Dashboard',  icon: '◈' },
      { id: 'pnl',        label: 'P&L Journal', icon: '📅' },
	      { id: 'trades',     label: 'Trades',      icon: '⇄' },
	      { id: 'strategies', label: 'Strategies',  icon: '◎' },
	      { id: 'analytics',  label: 'Analytics',   icon: '⚡' },
	      { id: 'setups',     label: 'Setups',      icon: '⌁' },
	    ]
	  },
  {
    label: 'Systems',
    pages: [
      { id: 'position', label: 'Live Position', icon: '🎯' },
      { id: 'alpaca',  label: 'Alpaca',   icon: '📊' },
      { id: 'book',    label: 'Book Status', icon: '▦' },
      { id: 'regime',  label: 'Regime',   icon: '⬡' },
      { id: 'sweep',   label: 'Sweeps',     icon: '🔬' },
      { id: 'tv',      label: 'TV Signals', icon: '📡' },
      { id: 'journal', label: 'Project Log',  icon: '◻' },
    ]
  },
  {
    label: 'Tools',
    pages: [
      { id: 'ai',    label: 'AI Chat',  icon: '🤖' },
      { id: 'credentials', label: 'API Keys', icon: '⚿' },
      { id: 'users', label: 'Users',    icon: '👥' },
    ]
  }
];

const ALL_PAGES = NAV_GROUPS.flatMap(g => g.pages);

function initialPageFromLocation() {
  const path = window.location.pathname;
  if (path === '/position.html' || path === '/position') return 'position';
  return 'dashboard';
}

function App() {
  const [stage, setStage] = useState('init');
  const [email, setEmail] = useState('');
  const [page, setPage] = useState(initialPageFromLocation);
  const [status, setStatus] = useState(null);

  useEffect(() => {
    api('/auth/me').then(d => { setEmail(d.email); setStage('authed'); })
                  .catch(() => setStage('login'));
  }, []);

  useEffect(() => {
    if (stage !== 'authed') return;
    const load = () => api('/api/status').then(setStatus).catch(() => {});
    load();
    const t = setInterval(load, 10000);
    return () => clearInterval(t);
  }, [stage]);

  useEffect(() => {
    const openAI = () => setPage('ai');
    window.addEventListener('open-ai-chat-card', openAI);
    return () => window.removeEventListener('open-ai-chat-card', openAI);
  }, []);

  async function logout() {
    await fetch('/auth/logout', { method: 'DELETE', credentials: 'include' }).catch(() => {});
    setStage('login'); setEmail('');
  }

  if (stage === 'init') return React.createElement('div', { className: 'loading', style: { minHeight: '100vh' } }, React.createElement('div', { className: 'spinner' }));
  if (stage === 'login') return React.createElement(LoginScreen, { onPartial: e => { setEmail(e); setStage('totp'); } });
  if (stage === 'totp') return React.createElement(TOTPScreen, { email, onAuth: e => { setEmail(e); setStage('authed'); } });

  const alive = status?.bot_alive;

  const PageComponent = {
    dashboard:  Dashboard,
    pnl:        PnLJournal,
    trades:     Trades,
	    strategies: StrategiesPage,
	    analytics:  StrategyAnalyticsPage,
	    setups:     SetupScannerPage,
	    alpaca:     AlpacaPage,
    book:       BookStatusPage,
    regime:     RegimePage,
    journal:    JournalPage,
    position:   LivePositionPage,
    sweep:      SweepWatchdogPage,
    tv:         TVSignalsPage,
    ai:         AIChatPage,
    credentials: CredentialsPage,
    users:      UsersPage,
  }[page] || Dashboard;

  const currentPage = ALL_PAGES.find(p => p.id === page);

  return React.createElement('div', { className: 'shell' },
    React.createElement('aside', { className: 'sidebar' },
      React.createElement('div', { className: 'sidebar-logo' },
        React.createElement('span', { className: 'logo-icon' }, '📈'),
        React.createElement('div', null,
          React.createElement('div', { className: 'logo-text' }, 'Trading Bot'),
          React.createElement('div', { className: 'logo-sub' }, 'Journal')
        )
      ),
      NAV_GROUPS.map(g =>
        React.createElement('div', { key: g.label },
          React.createElement('div', { className: 'nav-section' }, g.label),
          g.pages.map(p =>
            React.createElement('div', { key: p.id, className: `nav-item ${page === p.id ? 'active' : ''}`, onClick: () => p.url ? (window.location.href = p.url) : setPage(p.id) },
              React.createElement('span', { className: 'icon' }, p.icon),
              React.createElement('span', null, p.label))
          )
        )
      ),
      React.createElement('div', { className: 'sidebar-bottom' },
        React.createElement('div', { className: 'user-info' },
          React.createElement('div', { className: 'user-avatar' }, email[0]?.toUpperCase() || '?'),
          React.createElement('div', { className: 'user-email', title: email }, email)
        ),
        React.createElement('button', { className: 'logout-btn', onClick: logout }, 'Sign out')
      )
    ),

    React.createElement('div', { className: 'main' },
      React.createElement('div', { className: 'topbar' },
        React.createElement('div', { className: 'topbar-title' }, currentPage?.label || 'Dashboard'),
        React.createElement('div', { className: 'topbar-right' },
          // ── 1-glance health summary (NEW 2026-05-03) ──────────────────
          // Today PnL: цвет зависит от знака
          status && (function () {
            const v = Number(status.today_pnl_total || 0);
            const sign = v >= 0 ? '+' : '';
            const cls = v > 0 ? 'pill pill-good' : v < 0 ? 'pill pill-bad' : 'pill pill-neutral';
            return React.createElement('span', { className: cls, title: `Today: ${status.today_trades_count} trades` },
              `Today ${sign}${v.toFixed(2)}$ · ${status.today_trades_count}t`);
          })(),
          // Last trade age — красный если abnormal_no_trades
          status && (function () {
            const age = status.last_trade_age_sec;
            const abnormal = !!status.abnormal_no_trades;
            let label = 'no trades';
            if (age !== null && age !== undefined) {
              const h = age / 3600;
              if (h < 1) label = `last: ${Math.round(age / 60)}m`;
              else if (h < 24) label = `last: ${h.toFixed(1)}h`;
              else label = `last: ${(h / 24).toFixed(1)}d`;
            }
            const cls = abnormal ? 'pill pill-bad pill-blink' : 'pill pill-neutral';
            const tip = status.last_trade_strategy
              ? `${status.last_trade_strategy} ${status.last_trade_symbol}` + (status.last_trade_pnl != null ? ` (${status.last_trade_pnl >= 0 ? '+' : ''}${status.last_trade_pnl.toFixed(2)}$)` : '')
              : 'No trades found';
            return React.createElement('span', { className: cls, title: tip }, label);
          })(),
          React.createElement('div', { className: `status-dot ${alive ? 'alive pulse' : alive === false ? 'dead' : 'unknown'}` }),
          React.createElement('span', { className: 'status-label' },
            status
              ? `${alive ? 'Live' : 'Offline'} · ${(status.regime || 'unknown').replace(/_/g,' ')} · ${status.open_trades} open`
              : 'Checking…'
          )
        )
      ),
      React.createElement('div', { className: 'page', style: page === 'ai' ? { display: 'flex', flexDirection: 'column', overflow: 'hidden' } : {} },
        React.createElement(PageComponent, null)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
