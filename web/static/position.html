<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Живые позиции</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b232d;--line:#2a3441;--tx:#e6edf3;
      --tx2:#8b98a8;--tx3:#5d6b7d;--up:#2ea86a;--dn:#e0475b;--acc:#4c8dff;--warn:#e8a33d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
     -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit}
/* шапка */
header{display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-shrink:0}
.pill{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;background:var(--panel2);
      border:1px solid var(--line);font-size:12px;color:var(--tx2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--up);flex-shrink:0}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--dn)}
.dot.live{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spacer{flex:1}
.btn{padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
     color:var(--tx);cursor:pointer;font-size:12.5px;transition:.14s}
.btn:hover{border-color:var(--acc)}
/* плашка */
.alert{display:none;align-items:center;gap:10px;padding:9px 16px;flex-shrink:0;font-size:13px;
       background:linear-gradient(90deg,rgba(224,71,91,.16),rgba(224,71,91,.03));
       border-bottom:1px solid rgba(224,71,91,.35)}
.alert.on{display:flex}
.alert.soft{background:linear-gradient(90deg,rgba(232,163,61,.14),rgba(232,163,61,.03));
            border-bottom-color:rgba(232,163,61,.35)}
.tag{padding:2px 8px;border-radius:5px;background:rgba(224,71,91,.2);color:#ff8a97;
     font-size:11px;font-weight:600;letter-spacing:.4px;flex-shrink:0}
.alert.soft .tag{background:rgba(232,163,61,.2);color:#f0bd6e}
/* раскладка */
main{flex:1;display:grid;grid-template-columns:250px 1fr 320px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.chead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;
       justify-content:space-between;gap:8px;flex-shrink:0}
.chead h2{font-size:11px;font-weight:600;letter-spacing:.9px;color:var(--tx3);text-transform:uppercase}
.scroll{overflow-y:auto;flex:1}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:#26303c;border-radius:9px}
/* карточки позиций */
.pos{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;
     border-left:3px solid transparent;transition:.14s}
.pos:hover{background:var(--panel)}
.pos.on{background:var(--panel);border-left-color:var(--acc)}
.r1{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sym{font-weight:600}
.side{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px}
.side.short{background:rgba(224,71,91,.16);color:#ff8a97}
.side.long{background:rgba(46,168,106,.16);color:#5fd39b}
.r2{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2)}
.p{color:var(--up)} .n{color:var(--dn)}
.bar{height:3px;border-radius:9px;background:#212b36;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7fb2ff)}
.wrow{margin-top:7px;font-size:11px;color:var(--warn);line-height:1.4}
.empty{padding:26px 16px;text-align:center;color:var(--tx3);font-size:13px}
/* график */
.tfbar{display:flex;gap:3px}
.tf{padding:3px 9px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--tx2);
    border:1px solid transparent}
.tf:hover{color:var(--tx)}
.tf.on{background:var(--panel2);border-color:var(--line);color:var(--tx)}
#chart{flex:1;min-height:0;position:relative}
#chartMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          color:var(--tx3);font-size:13px;pointer-events:none}
.legend{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);
        font-size:11px;color:var(--tx2);flex-wrap:wrap;flex-shrink:0}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}
.why{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);
     flex-shrink:0;max-height:132px;overflow-y:auto}
.why b{color:var(--tx)}
.metrics{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.metrics div{font-size:11px;color:var(--tx3)}
.metrics span{color:var(--tx);font-weight:600}
/* чат */
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:94%;padding:8px 11px;border-radius:11px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.msg.ai{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg.err{background:rgba(224,71,91,.12);border:1px solid rgba(224,71,91,.35)}
.quick{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 9px}
.q{padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);
   font-size:11.5px;color:var(--tx2);cursor:pointer}
.q:hover{border-color:var(--acc);color:var(--tx)}
.inp{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--line);flex-shrink:0}
.inp input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
           padding:8px 11px;color:var(--tx);font-size:13px;outline:none}
.inp input:focus{border-color:var(--acc)}
@media (max-width:1100px){main{grid-template-columns:210px 1fr}.col.ai{display:none}}
</style>
</head>
<body>

<header>
  <div class="pill"><i class="dot live" id="dLive"></i><span id="tLive">подключаюсь…</span></div>
  <div class="pill"><i class="dot" id="dBot"></i><span id="tBot">бот</span></div>
  <div class="pill" id="pRegime">режим —</div>
  <div class="spacer"></div>
  <div class="pill" id="pRisk">риск —</div>
  <button class="btn" onclick="load(true)">Обновить</button>
</header>

<div class="alert" id="alert"><span class="tag" id="alertTag">ВНИМАНИЕ</span><span id="alertTxt"></span></div>

<main>
  <div class="col">
    <div class="chead"><h2>Позиции</h2><span id="posCount" style="font-size:11px;color:var(--tx3)">—</span></div>
    <div class="scroll" id="poslist"><div class="empty">загрузка…</div></div>
  </div>

  <div class="col">
    <div class="chead">
      <h2 id="chartTitle">график</h2>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="tfbar" id="tfbar"></div>
        <button class="btn" onclick="moreHistory()" title="Загрузить больше истории с сервера">＋ история</button>
      </div>
    </div>
    <div id="chart"><div id="chartMsg">выбери позицию слева</div></div>
    <div class="legend">
      <span><i style="background:#4c8dff"></i>вход</span>
      <span><i style="background:#e0475b"></i>стоп</span>
      <span><i style="background:#2ea86a"></i>цели</span>
      <span><i style="background:#e8a33d"></i>линия сигнала</span>
      <span id="histNote" style="color:var(--tx3)"></span>
    </div>
    <div class="why" id="why"></div>
  </div>

  <div class="col ai">
    <div class="chead"><h2>Помощник</h2><span class="pill" id="aiSees">—</span></div>
    <div class="chat" id="chat"></div>
    <div class="quick">
      <div class="q" onclick="ask('Почему мы вошли в эту позицию?')">почему вошли?</div>
      <div class="q" onclick="ask('Что сейчас с защитой позиции?')">защита?</div>
      <div class="q" onclick="ask('Стоит ли двигать стоп?')">двигать стоп?</div>
      <div class="q" onclick="ask('Опиши все открытые позиции.')">все позиции</div>
    </div>
    <div class="inp">
      <input id="q" placeholder="Спросить про эту позицию…" onkeydown="if(event.key==='Enter')ask(this.value)">
      <button class="btn" onclick="ask(document.getElementById('q').value)">→</button>
    </div>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Живые позиции. Заменяет старую версию, где был один график на все
   позиции, зашитый таймфрейм 5m и зум по уже загруженному массиву.

   Что изменилось:
     · карточка и отдельный график на КАЖДУЮ позицию;
     · переключение таймфрейма перезапрашивает свечи с сервера;
     · «＋ история» расширяет окно запроса (сервер отдаёт ±8ч от
       entry_ts, поэтому окно раздвигается сдвигом entry_ts назад);
     · на графике рисуются вход, стоп, все цели и линия сигнала;
     · панель сверки: возраст данных, защита, предупреждения;
     · чат с историей в рамках сессии.

   ДЛЯ CODEX: два места, где нужен backend, помечены TODO-BACKEND.
   Без них файл работает — просто эти данные не показываются.
   ═══════════════════════════════════════════════════════════════════ */

const TFS = [["1","1м"],["5","5м"],["15","15м"],["60","1ч"],["240","4ч"]];
let tf = "5", cur = 0, view = null, histHours = 8, chartKey = "";

/* ── утилиты ─────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const num = v => { const n=Number(v); return v!==null && v!=="" && isFinite(n) ? n : null; };
const fmt = (v,d=2) => num(v)===null ? "—" : num(v).toFixed(d);
const fmtQty = x => { const n=num(x); return n===null ? "—" : n.toFixed(9).replace(/\.?0+$/, ""); };
const epochMs = v => { const n=num(v); return n===null ? null : (n<2e10?n*1000:n); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function price(v){ if(num(v)===null) return "—";
  const a=Math.abs(v); return v.toFixed(a<1?6:a<100?4:2); }
async function api(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(r.status+" "+r.statusText);
  return r.json();
}

/* ── график ──────────────────────────────────────────────────────── */
const chart = LightweightCharts.createChart($("chart"), {
  layout:{background:{color:"#0d1117"},textColor:"#8b98a8",fontSize:11},
  grid:{vertLines:{color:"#182029"},horzLines:{color:"#182029"}},
  rightPriceScale:{borderColor:"#2a3441"},
  timeScale:{borderColor:"#2a3441",timeVisible:true,secondsVisible:false},
  crosshair:{mode:0,vertLine:{color:"#3c4a5a",labelBackgroundColor:"#2a3441"},
             horzLine:{color:"#3c4a5a",labelBackgroundColor:"#2a3441"}},
});
const cs = chart.addCandlestickSeries({upColor:"#2ea86a",downColor:"#e0475b",
  borderVisible:false,wickUpColor:"#2ea86a",wickDownColor:"#e0475b"});
let priceLines = [], sigSeries = null, chartRequestId = 0;
new ResizeObserver(e => chart.resize(e[0].contentRect.width, e[0].contentRect.height))
  .observe($("chart"));

$("tfbar").innerHTML = TFS.map(([v,l]) =>
  `<div class="tf ${v===tf?"on":""}" data-v="${v}" onclick="setTf('${v}')">${l}</div>`).join("");
function setTf(v){ tf=v; histHours=8;
  document.querySelectorAll(".tf").forEach(e=>e.classList.toggle("on", e.dataset.v===v));
  drawChart(true); }
function moreHistory(){ histHours = Math.min(histHours*3, 24*30); drawChart(true); }

function clearLines(){ priceLines.forEach(l=>{try{cs.removePriceLine(l)}catch(e){}}); priceLines=[];
  if(sigSeries){ try{chart.removeSeries(sigSeries)}catch(e){} sigSeries=null; } }

async function drawChart(force){
  const p = positions()[cur];
  if(!p){ chartRequestId++; cs.setData([]); clearLines();
    $("chartMsg").style.display="flex"; $("chartMsg").textContent="нет открытых позиций — бот сканирует рынок"; return; }
  const sym = p.symbol;
  const entryTs = epochMs(p.entry_ts) || epochMs(p.opened_ts) || (Date.now()-6*3600e3);
  const key = sym+"|"+tf+"|"+histHours;
  if(key===chartKey && !force) return;
  chartKey = key;
  const requestId = ++chartRequestId;
  $("chartMsg").style.display="flex"; $("chartMsg").textContent="загружаю свечи…";
  // окно расширяем сдвигом entry_ts назад: сервер добавляет 8ч до и 4ч после
  const from = Math.round(entryTs) - Math.max(0, histHours-8)*3600e3;
  const url = `/api/trades/chart?symbol=${encodeURIComponent(sym)}`
            + `&entry_ts=${Math.round(from)}&exit_ts=${Date.now()}&interval=${tf}`;
  let raw;
  try { raw = await api(url); }
  catch(e){ if(requestId===chartRequestId) $("chartMsg").textContent = "свечи не пришли: "+e.message; return; }
  if(requestId!==chartRequestId) return;
  const rows = Array.isArray(raw) ? raw : (raw.candles || raw.data || []);
  if(!rows.length){ $("chartMsg").textContent="свечей нет за это окно"; return; }
  const data = rows.map(c => ({
      time: Math.floor((num(c.time_ms) ?? num(c.time) ?? num(c.t) ?? 0)/1000),
      open:+c.open, high:+c.high, low:+c.low, close:+c.close }))
    .filter(c => c.time>0 && isFinite(c.close))
    .sort((a,b)=>a.time-b.time);
  cs.setData(data);
  $("chartMsg").style.display="none";
  $("histNote").textContent = `окно ~${histHours} ч · ${data.length} свечей`;

  clearLines();
  const line=(v,color,title,dash)=>{ if(num(v)===null) return;
    priceLines.push(cs.createPriceLine({price:+v,color,lineWidth:dash?1:2,
      lineStyle:dash?2:0,axisLabelVisible:true,title})); };
  line(p.entry ?? p.entry_price, "#4c8dff", "вход");
  line(p.sl ?? p.stop ?? p.stop_price, "#e0475b", "стоп");
  (p.tp_targets||[]).forEach((t,i)=>line(t,"#2ea86a","цель "+(i+1)));

  // линия сигнала (наклонная) — если стратегия её отдала
  const g = p.signal_geometry || {};
  const sl0 = (g.sloped_lines||[])[0];
  if(sl0 && num(sl0.projection_at_signal) && num(sl0.slope_pct_per_day) && data.length){
    sigSeries = chart.addLineSeries({color:"#e8a33d",lineWidth:2,
      priceLineVisible:false,lastValueVisible:false});
    const t0 = Math.floor((epochMs(g.entry_ts)||entryTs)/1000);
    sigSeries.setData(data.map(d=>({time:d.time,
      value: sl0.projection_at_signal*(1 + sl0.slope_pct_per_day/100*(d.time-t0)/86400)})));
  } else if(num(g.primary_level)){
    line(g.primary_level, "#e8a33d", g.primary_role||"уровень", true);
  }

  const eSec = Math.floor(entryTs/1000);
  const near = data.reduce((a,b)=>Math.abs(b.time-eSec)<Math.abs(a.time-eSec)?b:a, data[0]);
  cs.setMarkers([{time:near.time, position:(p.side||"").toLowerCase().startsWith("s")?"aboveBar":"belowBar",
    color:"#4c8dff", shape:(p.side||"").toLowerCase().startsWith("s")?"arrowDown":"arrowUp",
    text:"вход "+price(p.entry ?? p.entry_price)}]);
  chart.timeScale().fitContent();

  $("chartTitle").textContent = `${sym} · ${p.side||""} · ${tf==="240"?"4ч":tf==="60"?"1ч":tf+"м"}`;
  renderWhy(p);
}

function renderWhy(p){
  const g = p.signal_geometry || {};
  const why = g.source_reason || p.signal_reason || p.strategy || "";
  const m = g.metrics || {};
  const st = p.runner_state || {};
  const rows = [];
  if(num(p.r_now)!==null) rows.push(["сейчас", fmt(p.r_now,2)+"R"]);
  if(num(p.progress_to_tp1_pct)!==null) rows.push(["до цели 1", Math.round(p.progress_to_tp1_pct)+"%"]);
  if(num(p.stop_vs_entry_pct)!==null) rows.push(["стоп от входа", fmt(p.stop_vs_entry_pct,2)+"%"]);
  if(st.trailing_armed!==undefined) rows.push(["трейлинг", st.trailing_armed?"включён":"не взведён"]);
  Object.entries(m).forEach(([k,v])=>rows.push([k, typeof v==="number"?fmt(v,3):v]));
  $("why").innerHTML =
    (why ? `<b>Почему вошли:</b> <span class="mono" style="font-size:11.5px">${esc(why)}</span>` :
           `<b>Причина входа неизвестна</b> — позиция без паспорта сигнала (метка bootstrap: подхвачена после перезапуска или открыта руками).`)
    + (rows.length?`<div class="metrics">`+rows.map(([k,v])=>`<div>${esc(k)} <span>${esc(v)}</span></div>`).join("")+`</div>`:"")
    + ((p.warnings||[]).length?`<div class="wrow">⚠ ${esc((p.warnings||[]).join(" · "))}</div>`:"");
}

/* ── позиции ─────────────────────────────────────────────────────── */
function positions(){
  if(!view) return [];
  const b = (view.positions||[]).map(p=>({...p, venue:"Bybit",
    warnings:p.warnings || ((p.exit_state||{}).warnings) || []}));
  const a = (view.alpaca||[]).map(p=>({...p, venue:"Alpaca",
    entry:p.entry, sl:p.stop, upnl:p.upnl}));
  return b.concat(a);
}
function renderPos(){
  const list = positions();
  $("posCount").textContent = list.length ? list.length+" шт" : "пусто";
  if(!list.length){ $("poslist").innerHTML =
    `<div class="empty">Открытых позиций нет.<br><span style="font-size:11.5px">Данные от ${age()}</span></div>`;
    $("chartMsg").style.display="flex"; $("chartMsg").textContent="нет открытых позиций"; return; }
  if(cur>=list.length) cur=0;
  $("poslist").innerHTML = list.map((p,i)=>{
    const u = num(p.upnl);
    const prog = Math.max(0, Math.min(100, num(p.progress_to_tp1_pct)||0));
    const w = (p.warnings||[]);
    return `<div class="pos ${i===cur?"on":""}" onclick="pick(${i})">
      <div class="r1"><span class="sym">${esc(p.symbol)}</span>
        <span class="side ${(p.side||"").toLowerCase().startsWith("s")?"short":"long"}">${esc((p.side||"?").toUpperCase())}</span></div>
      <div class="r2"><span class="mono">${fmtQty(p.qty)} @ ${price(p.entry ?? p.entry_price)}</span>
        <span class="mono ${u>=0?"p":"n"}">${u===null?"—":(u>=0?"+":"")+u.toFixed(2)+"$"}${num(p.r_now)!==null?" · "+fmt(p.r_now,2)+"R":""}</span></div>
      <div class="r2" style="margin-top:2px"><span style="font-size:11px;color:var(--tx3)">${esc(p.venue)}${p.strategy?" · "+esc(p.strategy):""}</span>
        <span style="font-size:11px;color:var(--tx3)">стоп ${price(p.sl ?? p.stop)}</span></div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      ${w.length?`<div class="wrow">⚠ ${esc(w.join(" · "))}</div>`:""}
    </div>`;}).join("");
}
function pick(i){ cur=i; histHours=8; renderPos(); drawChart(true); }

function age(){
  const ts = num(view && view.ts); if(ts===null) return "неизвестно когда";
  const s = Math.max(0, Math.round(Date.now()/1000 - (ts>2e10?ts/1000:ts)));
  return s<90 ? s+" с назад" : Math.round(s/60)+" мин назад";
}

/* ── сверка и шапка ──────────────────────────────────────────────── */
function renderHead(){
  const ts = num(view && view.ts);
  const sec = ts===null ? 1e9 : Math.max(0, Date.now()/1000 - (ts>2e10?ts/1000:ts));
  $("tLive").textContent = "данные "+age();
  $("dLive").className = "dot live "+(sec<30?"":sec<180?"warn":"bad");
  const alive = view && view.alive;
  $("dBot").className = "dot "+(alive?"":"bad");
  $("tBot").textContent = alive ? "бот торгует" : "бот не подтверждает торговлю";
  $("pRegime").textContent = "режим " + ((view&&view.regime) || "—");
  const h = (view&&view.health)||{};
  $("pRisk").textContent = "риск " + (num(h.risk_per_trade_pct)!==null ? h.risk_per_trade_pct+"%" : "—");

  // broker ↔ bot truth comes from /api/position/live and is never inferred by AI.
  const list = positions();
  const noStop = list.filter(p => num(p.sl ?? p.stop)===null);
  const a=$("alert");
  if(sec>=180){
    a.className="alert on"; $("alertTag").textContent="ДАННЫЕ УСТАРЕЛИ";
    $("alertTxt").textContent=`Последнее обновление ${age()}. Показанное может не совпадать с биржей.`;
  } else if(noStop.length){
    a.className="alert on"; $("alertTag").textContent="НЕТ ЗАЩИТЫ";
    $("alertTxt").textContent=`Без стопа на бирже: ${noStop.map(p=>p.symbol).join(", ")}.`;
  } else if(view && view.truth && view.truth.mismatch){
    a.className="alert on"; $("alertTag").textContent="РАСХОЖДЕНИЕ";
    $("alertTxt").textContent=view.truth.mismatch;
  } else { a.className="alert"; }
  $("aiSees").textContent = "видит "+list.length+" позиц.";
}

/* ── загрузка ────────────────────────────────────────────────────── */
async function load(force){
  try{
    view = await api("/api/position/live");
    renderPos(); renderHead(); drawChart(force);
  }catch(e){
    $("dLive").className="dot bad";
    $("tLive").textContent="нет связи с сервером";
  }
}
load(true);
setInterval(()=>load(false), 5000);
setInterval(renderHead, 1000);

/* ── чат ─────────────────────────────────────────────────────────── */
const hist=[];
function push(cls,text){ const d=document.createElement("div"); d.className="msg "+cls;
  d.textContent=text; $("chat").appendChild(d); $("chat").scrollTop=$("chat").scrollHeight; return d; }
push("ai","Спроси про любую открытую позицию. Я вижу их состав, защиту, цели и причину входа.");
async function ask(t){
  t=(t||"").trim(); if(!t) return;
  $("q").value=""; push("me",t); hist.push({role:"user",content:t});
  const wait=push("ai","…");
  const p=positions()[cur];
  const selected=p?p.symbol:"нет выбранной позиции";
  const messages=hist.slice(-8).map((m,i)=>i===hist.slice(-8).length-1 && m.role==="user"
    ? {role:"user",content:`Выбрано в панели: ${selected}. ${m.content}`}
    : {role:m.role,content:m.content});
  try{
    const r=await api("/api/ai/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages})});
    const txt=r.reply||r.answer||r.text||r.message||JSON.stringify(r);
    wait.textContent=txt; hist.push({role:"assistant",content:txt});
  }catch(e){ wait.className="msg err"; wait.textContent="ИИ не ответил: "+e.message; }
}
</script>
